name: Swap recovery checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swap-recovery-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run swap recovery tests
        run: npm test -- --run

      - name: Verify production build
        run: npm run build
